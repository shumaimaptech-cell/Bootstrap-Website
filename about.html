.footer {

/* =========================
   FOOTER CONTAINER
========================= */

.footer-container {
    max-width: 1200px;
    width: 88%;
    margin: auto;

    padding: 45px 0;

    display: flex;
    justify-content: space-between;

    gap: 70px;
}


/* =========================
   COLUMNS
========================= */

.footer-column {
    width: 33%;
}


/* =========================
   LOGO
========================= */

.footer-logo {
    display: inline-block;

    color: #5EEAD4;

    font-size: 28px;
    font-weight: bold;

    text-decoration: none;

    margin-bottom: 15px;
}


/* =========================
   PARAGRAPH
========================= */

.footer-column p {
    max-width: 330px;

    color: #E8F1F2;

    font-size: 14px;

    line-height: 1.7;
}


/* =========================
   HEADINGS
========================= */

.footer-column h3 {
    color: white;

    font-size: 18px;

    margin-bottom: 20px;
}


/* QUICK LINKS */

.footer ul {
    list-style: none !important;
    padding: 0 !important;
    margin: 0 !important;
}

.footer ul li {
    margin-bottom: 12px;
}

.footer ul li a,
.footer ul li a:visited,
.footer ul li a:active {
    color: white !important;
    text-decoration: none !important;
}

.footer ul li a:hover {
    color: #5EEAD4 !important;
    text-decoration: none !important;
}

/* =========================
   COPYRIGHT
========================= */

.copyright {
    margin-top: 25px;
}


/* =========================
   SOCIAL ICONS
========================= */

.social-icons {
    display: flex;

    gap: 12px;

    margin-bottom: 25px;
}

.social-icons a {
    width: 38px;
    height: 38px;

    border: 1px solid white;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    text-decoration: none;

    transition: 0.3s;
}

.social-icons a:hover {
    background-color: #5EEAD4;

    border-color: #5EEAD4;

    color: #073B4C;
}


/* =========================
   NEWSLETTER
========================= */

.newsletter-title {
    margin-bottom: 10px !important;
}

.newsletter {
    display: flex;

    width: 100%;
    max-width: 350px;
}

.newsletter input {
    width: 100%;

    height: 38px;

    padding: 0 10px;

    border: none;

    outline: none;

    border-radius: 5px 0 0 5px;

    font-size: 13px;
}

.newsletter button {
    width: 50px;

    height: 38px;

    border: none;

    background-color: #5EEAD4;

    color: #073B4C;

    cursor: pointer;

    border-radius: 0 5px 5px 0;

    font-size: 18px;

    transition: 0.3s;
}

.newsletter button:hover {
    background-color: white;
}


/* =========================

========================= */

    padding: 18px;

    color: #D5E4E7;

    font-size: 12px;
}

.footer-bottom i {
    color: #5EEAD4;
}
