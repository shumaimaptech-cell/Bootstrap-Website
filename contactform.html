<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact US</title>

    <!-- Font Awesome Cdn Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Bs Cdn CSS Link 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

          <!-- Aos Animation Cdn Link -->
   <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
.contact-form {
    padding: 20px;
}

.contact-form input {
    padding: 10px;
    border: 1px solid #ccc;
}

.contact-form button {
    background: #087C89;
    color: white;
    border: none;
    padding: 10px 25px;
}

.contact-form button:hover {
    background: #0B3A55;
}

.contact-box h3 {
    color: #0B3A55;
}

.contact-box i {
    color: #087C89;
}
</style>
<body>


    <!-- contact -->
    <h2 class="contact-title text-center contact-section"data-aos="zoom-in-up">Contact Us</h2>
    <br>
    <div class="container contact-container">
        <div class="row">
            <!-- Form -->
            <div class="col-6 border border-2 border-dark">
                <form action="webpage.html"  class="contact-form">
                    <div class="container">
                        <!-- Row 1 -->
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="fn" class="form-label"> First Name:</label>
                                <input type="text" id="fn" placeholder="Enter Your First Name" class="form-control">
                            </div>
                            <div class="col-6">
                                <label for="ln" class="form-label"> Last Name:</label>
                                <input type="text" id="ln" placeholder="Enter Your Last Name" class="form-control"
                                    required>
                            </div>
                        </div>


                            <!-- Row 2 -->
                            <div class="row mb-3">
                                <div class="col-12">
                                    <label for="e" class="form-label">Email:</label>
                                    <input type="email" id="e" placeholder="Enter Your Email Address"
                                        class="form-control" required>
                                </div>
                            </div>

                                <!-- Row 3 -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="p" class="form-label">Password:</label>
                                        <input type="password" id="p" placeholder="Enter Your Password"
                                            class="form-control" required>
                                    </div>
                                </div>

                                    <!-- Row 4 -->
                                    <div class="row mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="gender" id="m">
                                            <label class="form-check-label" for="m">
                                                Male
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="gender" id="f" checked>
                                            <label class="form-check-label" for="m">
                                                Female
                                            </label>
                                        </div>
                                    </div>

                                    <!-- Row 5 -->
                                    <div class="row mb-3">
                                        <button class="btn btn-primary">Submit</button>
                                    </div>
                                </div>
                </form>


            </div>
            <div class="col-6">

                <div class="contact-box contact-info">

                    <h3 data-aos="zoom-in-left">Get In Touch</h3>

                    <div class="contact-info" data-aos="fade-up">
                        <i class="fa-solid fa-location-dot"></i>

                        <div>
                            <h6>Our Location</h6>
                            <p>Karachi, Pakistan</p>
                        </div>
                    </div>

                    <div class="contact-info" data-aos="fade-up">
                        <i class="fa-solid fa-phone"></i>

                        <div>
                            <h6>Phone</h6>
                            <p>+92 300 1234567</p>
                        </div>
                    </div>

                    <div class="contact-info" data-aos="fade-up">
                        <i class="fa-solid fa-envelope"></i>

                        <div>
                            <h6>Email</h6>
                            <p>wanderbook@gmail.com</p>
                        </div>
                    </div>

                    <div class="contact-info" data-aos="fade-up">
                        <i class="fa-solid fa-clock"></i>

                        <div>
                            <h6>Opening Hours</h6>
                            <p>Mon - Sat: 9:00 AM - 6:00 PM</p>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>
    <!-- Aos Animation Js Link -->
 <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

 <script>
  AOS.init();
</script>

<!-- Bs Cdn CSS Link 5.3 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>
</html>
